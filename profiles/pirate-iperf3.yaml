backend: iperf3
name: pirate-iperf3-test

nodes:
  initiator: a100-03
  target: a100-04

dimensions:
  threads: "1:4"

execution:
  namespace: nwadekar-pirate
  image: quay.io/nwadekar/kubernetes-cluster-bench:latest
  log_directory: logs
  runs: 3
  timeout_seconds: 120
  keep_resources: false
  
  iperf3:
    duration_seconds: 5
    warmup_seconds: 1
