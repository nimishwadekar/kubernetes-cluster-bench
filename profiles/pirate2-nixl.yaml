backend: nixl
name: pirate2-nixl

nodes:
  initiator: dell-b200-01
  target: dell-b200-02

dimensions:
  threads: 1:8
  block_size: 1K:8M
  batch_size: 1:8

execution:
  namespace: default
  image: quay.io/nwadekar/nixl-benchmark:og-nixl1.4.1-ucx1.22.0
  log_directory: logs
  runs: 100
  timeout_seconds: 120
  keep_resources: false
  nixl:
    warmup_runs: 10
